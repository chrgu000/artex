# pre-commit 配置示例（官方文档：https://pre-commit.com）
#
# 把仓库 CI 里两道确定性合并门禁提前放到本地提交阶段，
# 让坏改动在推送前就被拦住。任一钩子断言失败都会以非零退出码中止提交。
#
# 1) detections — 仅当检测规则（detections/）或其钉住的上游源码发生变化时，
#    运行一次跑完八项检测测试的脚本（detections/tests/run-all.sh）。
#    规则与源码范围与 CI（.github/workflows/detections.yml）一致，用来抓住
#    只改了规则、却没更新测试或分层的提交。需要 Docker（每个测试在容器里隔离执行，
#    脚本本身不安装任何东西）。
# 2) docs — 检查已跟踪 Markdown 里的仓库内链接、图片和锚点（#标题）是否指向真实对象
#    （scripts/check-doc-links.py）。检查内容与 CI（.github/workflows/docs.yml）相同。
#    那边不按路径过滤、对所有变更都跑，这里也不收窄文件范围（always_run）。
#    链接不仅在改 .md 时会断，删掉或移走被指向的文件（图片、LICENSE 等）时也会断。
#    只用 Python 标准库、不访问网络，没有 Docker 也能在几十毫秒内跑完。
#
# 安装：       pip install pre-commit && pre-commit install
# 手动执行：   pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# 这是只挂这两个钩子的最小示例。若还要 Go 或前端检查，在下面自行追加钩子。
repos:
  - repo: local
    hooks:
      - id: detections
        name: 检测规则测试 8 项（Sigma·Suricata·ATT&CK·指标·MISP）
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go)'
      - id: docs
        name: 文档内部链接、图片与锚点（#标题）完整性检查
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
